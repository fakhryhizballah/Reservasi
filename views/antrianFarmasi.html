<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antrian Farmasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          boxShadow: {
            glow: '0 0 30px rgba(14, 165, 233, 0.35)'
          }
        }
      }
    };
  </script>
  <style>
    html,
    body {
      height: 100%;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(14, 165, 233, 0.25), transparent 25%),
        radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.25), transparent 30%),
        #020817;
    }

    .panel-scroll::-webkit-scrollbar {
      width: 10px;
    }

    .panel-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }

    .panel-scroll {
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.4) transparent;
    }

    .queue-card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(12, 18, 31, 0.88));
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    @keyframes pulse-glow {

      0%,
      100% {
        box-shadow: 0 0 0 rgba(59, 130, 246, 0.15);
      }

      50% {
        box-shadow: 0 0 28px rgba(59, 130, 246, 0.22);
      }
    }

    .status-highlight {
      animation: pulse-glow 2.4s ease-in-out infinite;
    }
     @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.8s ease-out forwards;
            opacity: 0;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
  </style>
</head>

<body class="text-slate-50 antialiased">
  <div class="flex h-screen flex-col">
    <header class="flex items-center justify-between border-b border-slate-700 bg-slate-900/80 px-8 py-6 backdrop-blur-sm">
      <div class="flex items-center gap-6">
        <!-- Logo Container -->
        <div class="bg-white p-2 rounded-2xl shadow-[0_0_15px_rgba(16,185,129,0.3)] h-20 w-20 flex items-center justify-center shrink-0">
          <img src="/reservasi/assets/images/logo.png" alt="Logo RSUD" class="max-h-full max-w-full object-contain" loading="lazy" />
        </div>
        <div>
          <h1 class="text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-blue-400 tracking-wide uppercase drop-shadow-sm">
            Antrian Farmasi Rawat Jalan
          </h1>
          <p class="text-2xl text-emerald-100/70 mt-2 font-light tracking-wider">
            RSUD dr. Abdul Aziz Singkawang
          </p>
        </div>
      </div>
      <div class="text-right">
        <div class="text-xs uppercase tracking-[0.35em] text-slate-400">Tanggal</div>
        <div id="todayLabel" class="mt-2 text-2xl font-semibold text-cyan-300"></div>
        <div id="clockLabel" class="mt-1 text-4xl font-black tabular-nums text-white"></div>
      </div>
    </header>

    <main class="flex-1 px-6 py-5">
      <div class="grid h-full grid-cols-2 gap-6">
        <section class="flex min-h-0 flex-col rounded-3xl border border-amber-500/30 bg-gradient-to-br from-amber-500/10 via-slate-900/95 to-slate-950 p-4 shadow-glow">
          <div class="mb-4 flex items-center justify-between rounded-2xl border border-amber-400/30 bg-amber-500/10 px-5 py-3">
            <div>
              <p class="text-xs uppercase tracking-[0.38em] text-amber-300">Status</p>
              <h2 class="text-3xl font-black uppercase text-amber-200">Sedang disiapkan</h2>
            </div>
            <div id="pendingCount" class="status-highlight flex h-16 w-16 items-center justify-center rounded-2xl bg-amber-500/20 text-3xl font-black text-amber-200">0</div>
          </div>
          <div id="pendingList" class="panel-scroll flex flex-col gap-4 flex-1 min-h-0 overflow-y-auto pr-2"></div>
        </section>

        <section class="flex min-h-0 flex-col rounded-3xl border border-emerald-500/30 bg-gradient-to-br from-emerald-500/10 via-slate-900/95 to-slate-950 p-4 shadow-glow">
          <div class="mb-4 flex items-center justify-between rounded-2xl border border-emerald-400/30 bg-emerald-500/10 px-5 py-3">
            <div>
              <p class="text-xs uppercase tracking-[0.38em] text-emerald-300">Status</p>
              <h2 class="text-3xl font-black uppercase text-emerald-200">Sudah Dilayani</h2>
            </div>
            <div id="servedCount" class="status-highlight flex h-16 w-16 items-center justify-center rounded-2xl bg-emerald-500/20 text-3xl font-black text-emerald-200">0</div>
          </div>
          <div id="servedList" class="panel-scroll flex flex-col gap-4 flex-1 overflow-y-auto pr-2"></div>
        </section>
      </div>
    </main>
  </div>

     <script src="/reservasi/assets/js/farmasi.js"></script>
</body>

</html>
